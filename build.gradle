
plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '1.0.0'
group = 'com.xluke44.DeltaSkinLoader'

base {
    archivesName = 'deltaskinloader'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

minecraft {
    mappings channel: 'official', version: '1.18.2'

    runs {
        data {
            workingDirectory project.file('run-data')

            mods {
                deltaskinloader {
                    source sourceSets.main
                }
            }

            args '--mod', 'deltaskinloader',
                 '--all',
                 '--output', file('src/generated/resources/'),
                 '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.18.2-40.3.0'
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
        minecraft_version      : '1.18.2',
        minecraft_version_range: '[1.18,1.18.2]',
        forge_version          : '40.3.0',
        forge_version_range    : '[40.3.0,)',
        loader_version_range   : '[40,)',
        mod_id                 : 'deltaskinloader',
        mod_name               : 'DeltaSkinLoader',
        mod_license            : 'BSD-3-Clause',
        mod_version            : '1.0.0',
        mod_authors            : 'XLuke44',
        mod_description        : 'Local skin loader'
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'     : 'deltaskinloader',
            'Specification-Vendor'    : 'XLuke44',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.version,
            'Implementation-Vendor'   : 'XLuke44',
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

